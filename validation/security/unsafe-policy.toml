version = 1

[policy]
source_roots = ["apps", "crates", "firmware"]
safe_crate_lint = "#![forbid(unsafe_code)]"
exception_crate_lint = "#![deny(unsafe_op_in_unsafe_fn)]"

# These files are the complete first-party unsafe surface at this baseline.
# Counts are deliberate drift detection: a new unsafe token needs a new reviewed entry.
[[exception]]
path = "firmware/stack_watermark.rs"
expected_unsafe = 4
reason = "Bench-only linker-bounded stack painting and volatile watermark scans. Cortex-m-rt paints ARM before main; Xtensa paints once at synchronous app entry before executor construction, below live SP with interrupts disabled, excluding guard and spill regions. No live-stack repaint."
review_by = "2027-10-16"

[[exception]]
path = "firmware/t114-phy/examples/protocol_capacity.rs"
expected_unsafe = 1
reason = "Build-only synthetic capacity image initializes its exclusively owned fixed static heap once before the protocol workload. No radio, USB or installation workflow is executed by the example build."
review_by = "2027-10-16"

[[exception]]
path = "firmware/t114-phy/src/heap.rs"
expected_unsafe = 2
reason = "The T114's one-time initialization of radio-hand's TrackingHeap over its fixed static array, called once from the first statement of main before any allocation."
review_by = "2027-11-20"

[[exception]]
path = "crates/radio-hand/src/heap.rs"
expected_unsafe = 7
reason = "The shared TrackingHeap behind the node feature: its one-shot init forwards to embedded-alloc's LLFF heap, and GlobalAlloc alloc/dealloc forward to it while counting high water and failed allocations. Each firmware owns the static and the fixed region."
review_by = "2027-11-20"

[[exception]]
path = "firmware/t114-phy/src/crash.rs"
expected_unsafe = 9
reason = "Fault persistence uses the reserved crash section and raw static crash record."
review_by = "2027-08-10"

[[exception]]
path = "firmware/t114-phy/src/main.rs"
expected_unsafe = 1
reason = "Board startup invokes the allocator exactly once before spawning work."
review_by = "2027-08-10"

[[exception]]
path = "firmware/heltec-v4-phy/src/wake_input.rs"
expected_unsafe = 2
reason = "The Light-sleep adapter reads and updates its exclusively owned GPIO14 PAC bits."
review_by = "2027-08-10"

[[exception]]
path = "crates/radio-hand/src/control/runtime.rs"
expected_unsafe = 1
reason = "The control runtime constructor requires an actual-reset proof; production consumes the board-startup token before any radio service."
review_by = "2027-09-09"

[[exception]]
path = "crates/radio-hand/src/control/runtime/tests.rs"
expected_unsafe = 1
reason = "The simulated fresh-boot helper invokes the reset-gated control runtime constructor once per isolated test runtime."
review_by = "2027-09-09"

[[exception]]
path = "crates/radio-hand/src/control/runtime/tests/basic.rs"
expected_unsafe = 2
reason = "Basic lifecycle tests invoke the reset-gated control runtime constructor only to model fresh board boots."
review_by = "2027-09-09"

[[exception]]
path = "crates/radio-hand/src/control/runtime/tests/inbound.rs"
expected_unsafe = 3
reason = "Inbound-control tests invoke the reset-gated control runtime constructor only to model fresh board boots."
review_by = "2027-09-09"

[[exception]]
path = "crates/radio-hand/src/control/runtime/tests/lifecycle.rs"
expected_unsafe = 1
reason = "The verified-command lifecycle test invokes the reset-gated control runtime constructor only to model a fresh board boot."
review_by = "2027-09-09"

[[exception]]
path = "crates/radio-hand/src/control/runtime/tests/quiet.rs"
expected_unsafe = 1
reason = "Quiet-state tests invoke the reset-gated control runtime constructor only to model a fresh board boot."
review_by = "2027-09-09"

[[exception]]
path = "crates/radio-hand/src/control/runtime/tests/recovery.rs"
expected_unsafe = 2
reason = "Recovery tests invoke the reset-gated control runtime constructor only to model fresh board boots."
review_by = "2027-09-09"

[[exception]]
path = "crates/station-custody/tests/lifecycle/board.rs"
expected_unsafe = 1
reason = "The station-claim lifecycle tests' in-process board invokes the reset-gated control runtime constructor only to model a fresh board boot. An integration test is its own crate, so the library keeps forbid(unsafe_code)."
review_by = "2027-11-20"

[[exception]]
path = "firmware/heltec-v4-phy/src/control_boot.rs"
expected_unsafe = 2
reason = "The startup-only reset marker and the resident runtime construction form the V4 boot-recovery boundary before host or radio service."
review_by = "2027-09-09"

[[exception]]
path = "firmware/heltec-v4-phy/src/main.rs"
expected_unsafe = 2
reason = "V4 startup mints the reset marker once after reset; the node build also initializes its static heap once, right after the control fixture check and before any allocation."
review_by = "2027-11-20"

[[exception]]
path = "firmware/heltec-v4-phy/src/heap.rs"
expected_unsafe = 2
reason = "The node build's one-time initialization of radio-hand's TrackingHeap over its fixed static 96 KiB array, called once from main before any allocation. The modem image does not compile this file."
review_by = "2027-11-20"

[[exception]]
path = "firmware/heltec-v4-phy/examples/protocol_capacity.rs"
expected_unsafe = 1
reason = "The MC4a link-only capacity example initializes its aligned static 64 KiB LLFF heap once before constructing the measured workload. The image is not flashed by validation."
review_by = "2027-09-13"
