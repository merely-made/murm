[package]
name = "signalman"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"
description = "The radio-management application of the Murm family: the signal box for a household's radios."
keywords = ["radio", "mesh", "reticulum", "lora"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "signalman"
path = "src/main.rs"

[[bin]]
name = "signalman-first-owner"
path = "src/bin/signalman-first-owner.rs"

[[bin]]
name = "signalman-control-status"
path = "src/bin/signalman-control-status.rs"

[[bin]]
name = "signalman-control-verified"
path = "src/bin/signalman-control-verified.rs"

[[bin]]
name = "signalman-control-configure"
path = "src/bin/signalman-control-configure.rs"

[features]
# Comms presentation and queue adapter over the application's message journal.
# Radio execution remains in the attended station owner.
comms = ["dep:comms", "dep:async-trait", "dep:sennet", "dep:tucket", "radio-hand/instances", "dep:tempfile", "dep:getrandom"]

[dependencies]
sennet = { path = "../../crates/sennet", optional = true }
tucket = { path = "../../crates/tucket", optional = true }
tempfile = { version = "3", optional = true }
async-trait = { version = "0.1", optional = true }
# The shared presentation vocabulary follows the desktop's Mere cohort.
comms = { package = "mere-comms", git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651", optional = true }
hex = "0.4"
getrandom = { version = "0.3", optional = true }
linkboy = { version = "0.1.0", path = "../linkboy" }
outrider = { version = "0.3.0", path = "../../crates/outrider", features = ["voice"] }
pipit = "0.2"
postilion = { version = "0.3.0", path = "../../crates/postilion" }
quick-xml = "0.39.4"
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand" }
retinue = { version = "0.3.0", path = "../../crates/retinue", features = ["tulle-radio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "sync", "time"] }
tulle = { version = "0.2.0", path = "../../crates/tulle", features = ["serial-async"] }
zeroize = "1"

[dev-dependencies]
selvage = { path = "../../crates/selvage" }
tempfile = "3"
