# Its own workspace root, excluded from retinue's. See the `exclude` note in the
# repository root manifest: genet's engine graph needs genet's `[patch]` table,
# and a patch does not inherit through a git dep, so pulling this into the main
# workspace would put the whole engine into every ordinary retinue build.
[workspace]

[package]
name = "signalman-desktop"
version = "0.0.1"
edition = "2024"
# Its own floor, not the workspace's. Retinue's `rust-version` is a promise
# about six published crates and their MSRV job; this package is private and
# rides genet, whose stack wants a newer toolchain than that promise allows.

rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"
description = "Signalman's desktop face for the owner firmware flow, on the shared Cambium desktop host."
# Private, and deliberately so. Its host rides genet packages that inherit
# genet's `publish = false`, so this cannot be installed from crates.io no
# matter how it is versioned. Claiming otherwise before `cargo package` and a
# clean resolution prove it would be the packaging defect the scope names.
publish = false

[lib]
name = "signalman_desktop"
path = "src/lib.rs"

[[bin]]
name = "signalman-desktop"
path = "src/main.rs"

[dependencies]
hex = "0.4"
getrandom = "0.3"
serial2-tokio = "0.1.24"
# The presentation vocabulary. NOT linkboy: package trust, plans, execution,
# and recovery decisions stay behind Signalman, and this application renders
# plan facts rather than reconstituting them.
signalman = { version = "0.1.0", path = "../signalman", features = ["comms"] }
# Linkboy's own types appear in Signalman's projections (FlashEvent, FlashPlan,
# OwnerStage, the receipt), so the face names them to match on them. It never
# calls a policy, planning, or execution function directly — the worker invokes
# the owning Signalman/Linkboy flow, and nothing here can construct a FlashPlan.
linkboy = { version = "0.1.0", path = "../linkboy" }

# First-party family sources follow their canonical main branches. Cargo.lock
# records the exact qualified cohort; keep one source per type-bearing family.
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.6.0" }
cambium-desktop = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.1.0" }
sprigging = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.3.0" }
# Renamed `taproot` at genet 7baa554c; the alias keeps the `genet_probe` paths.
genet-probe = { package = "taproot", version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
winit = "0.30"
cpal = "=0.18.2"

# Signalman's management graph and sealed station authority share the same
# Mere source as the desktop host.
station-custody = { git = "https://github.com/merely-made/mere.git", branch = "main" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
gaz = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
muniment = { features = ["redb"], git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
seiche = { git = "https://github.com/merely-made/mere.git", branch = "main" }
euclid = "0.22"
pollster = "0.4"
thiserror = "2"

# The live station actor. Postilion supplies the snapshot type the projection
# consumes. Djinn releases station-scoped keys and signs grants; Personae
# supplies the public device id.
postilion = { version = "0.3.0", path = "../../crates/postilion" }
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand", features = ["instances"] }
retinue = { version = "0.3.0", path = "../../crates/retinue" }
sennet = { version = "0.0.2", path = "../../crates/sennet" }
tucket = { version = "0.0.2", path = "../../crates/tucket" }
selvage = { version = "0.1.0", path = "../../crates/selvage" }
serde = { version = "1", features = ["derive"] }
zeroize = "1"
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# Application choice and authoring use the existing shared stack.
tabard = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["native-host"] }
directories = "6"
mesquite = { git = "https://github.com/merely-made/mere.git", branch = "main" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tulle = { version = "0.2.0", path = "../../crates/tulle", features = ["serial-async"] }

[dev-dependencies]
outrider = { path = "../../crates/outrider" }
# The accessibility receipt asserts against the projection the AccessKit
# adapter is handed, so it names AccessKit's own types.
accesskit = "0.25"
# The live bench receipt's announcing peer: a plain Postilion station with a
# short-lived random identity on the second attached board.
retinue = { version = "0.3.0", path = "../../crates/retinue" }
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand" }
getrandom = "0.3"

# Genet's graph needs the same patches its own workspace applies; a `[patch]`
# table does not inherit through a git dep. Taffy is the one vendored fork still
# taken from genet.git, at the same revision (the Stylo-rename adapter retired
# with Stylo at genet 55c05d11; ipc-channel left this graph by genet 15713014).
[patch.crates-io]
# Registry Webcue and native Genet sessions share one canonical input vocabulary.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Mere's patched AccessKit (support/patches/accesskit): its cambium hosts call
# methods only the patched copy has, so the same copy, from mere at this lock.
accesskit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
# Gaz and Mere exchange one Muniment family.
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
# Standalone roots must restate the qualified renderer patches.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
# Genet renamed its vendored Taffy package to `genet-taffy` after the revision
# this workspace used to pin, so the patch must name the package explicitly
# while keeping the `taffy` dependency alias Cargo expects.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
# station-custody's control codec calls `decode_cbor_strict`, which only Mere's
# p2panda fork carries. Restate mere's row for the one p2panda package this
# graph reaches, at the same immutable tag.
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
# No `parley` row: since genet 5ae30cad the fork is published as
# `genet-parley`, nothing in genet answers to `parley`, and a patch row would
# fail resolution (mere's own [patch.crates-io] says the same).

# station-custody names the Murm family through its tracked branch so its
# manifest works in a clean Mere checkout. Redirect every directly named
# type-bearing member to this workspace: the desktop and private port must
# exchange one Retinue/Postilion/radio-hand family.
[patch."https://github.com/merely-made/murm.git"]
# outrider joined the list 2026-09-02: station-custody now names it directly,
# and without the redirect two `outrider::codec::LxmfPayload`s land and
# `Station::send_payload` stops type-checking against the port.
outrider = { path = "../../crates/outrider" }
postilion = { path = "../../crates/postilion" }
retinue = { path = "../../crates/retinue" }
radio-hand = { path = "../../crates/radio-hand" }

selvage = { path = "../../crates/selvage" }
seneschal = { path = "../../crates/seneschal" }
tulle = { path = "../../crates/tulle" }

[workspace.package]
rust-version = "1.99"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[patch."https://github.com/merely-made/mere.git"]
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }

[patch."https://www.github.com/merely-made/mere.git"]
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }

# Keep the actor and apparatus-core on one published Armillary source identity
# when Mere and other Git suppliers refer to its canonical URL.
[patch."https://github.com/merely-made/armillary.git"]
armillary = { git = "https://www.github.com/merely-made/armillary.git", rev = "864f107d44bf759111ad2ea3c9036b2cfbf03f4c" }
apparatus-core = { git = "https://www.github.com/merely-made/armillary.git", rev = "06340b08327b29c3485ecb0089bb5cafed20fd80" }

# Keep admitted store and graph types identical across the local native crates
# and the current Mere Git consumer while the answer cohort advances.
[patch."https://github.com/merely-made/eidetic.git"]
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "f599ffe93298025bf6d65ae310a7cb4270ea52e3" }
