# Its own workspace root, excluded from retinue's. See the `exclude` note in the
# repository root manifest: genet's engine graph needs genet's `[patch]` table,
# and a patch does not inherit through a git dep, so pulling this into the main
# workspace would put the whole engine into every ordinary retinue build.
[workspace]

[package]
name = "signalman-desktop"
version = "0.0.1"
edition = "2024"
# Its own floor, not the workspace's. Retinue's `rust-version` is a promise
# about six published crates and their MSRV job; this package is private and
# rides genet, whose stack wants a newer toolchain than that promise allows.

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"
description = "Signalman's desktop face for the owner firmware flow, on the shared Cambium desktop host."
# Private, and deliberately so. Its host rides genet packages that inherit
# genet's `publish = false`, so this cannot be installed from crates.io no
# matter how it is versioned. Claiming otherwise before `cargo package` and a
# clean resolution prove it would be the packaging defect the scope names.
publish = false

[lib]
name = "signalman_desktop"
path = "src/lib.rs"

[[bin]]
name = "signalman-desktop"
path = "src/main.rs"

[dependencies]
hex = "0.4"
serial2-tokio = "0.1.24"
# The presentation vocabulary. NOT linkboy: package trust, plans, execution,
# and recovery decisions stay behind Signalman, and this application renders
# plan facts rather than reconstituting them.
signalman = { version = "0.1.0", path = "../signalman", features = ["comms"] }
# Linkboy's own types appear in Signalman's projections (FlashEvent, FlashPlan,
# OwnerStage, the receipt), so the face names them to match on them. It never
# calls a policy, planning, or execution function directly — the worker invokes
# the owning Signalman/Linkboy flow, and nothing here can construct a FlashPlan.
linkboy = { version = "0.1.0", path = "../linkboy" }

# The single-root Cambium desktop host and its view toolkit, at an exact
# revision. A branch dep would make a Signalman build depend on whatever the
# owning repo happened to have pushed; the exact rev is the reproducible
# private route the packaging decision calls for. Bump it deliberately, with a
# receipt.
#
# **Cambium moved from genet to mere on 2026-09-03** (the platform boundary
# pass). `cambium`, `cambium-genet-winit-host` and `sprigging` are mere
# workspace members under `crates/cambium/` now; genet keeps only the name
# claims. So they take a mere.git revision, and the genet-side DOM seams below
# take the genet revision *that mere revision itself pins* — mere main pins
# genet at b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084. One reference per git source: a second genet reference here
# would land two `LayoutDom`s and the host's would stop being the one this
# crate's views and receipts build against. Bump the genet rev when mere's
# moves, and only then.
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651", version = "0.3.3" }
cambium-genet-winit-host = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651", version = "0.1.0" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651", version = "0.2.1" }
# Renamed `taproot` at genet 7baa554c; the alias keeps the `genet_probe` paths.
genet-probe = { package = "taproot", version = "0.1.0", git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.1" }
winit = "0.30"
cpal = "=0.18.2"

# Signalman's management graph and its sealed station authority come from one
# exact Mere revision. Keep these on one source so identities and graph keys do
# not cross duplicate package instances.
mere-signalman = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
chartulary = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
gaz = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651", features = ["redb"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
scenomise = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
seiche = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
euclid = "0.22"
pollster = "0.4"
thiserror = "2"

# The live station actor. Postilion supplies the snapshot type the projection
# consumes. Djinn releases station-scoped keys and signs grants; Pandect
# supplies the public device id and lease records.
postilion = { version = "0.3.0", path = "../../crates/postilion" }
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand", features = ["instances"] }
retinue = { version = "0.3.0", path = "../../crates/retinue" }
sennet = { version = "0.0.2", path = "../../crates/sennet" }
tucket = { version = "0.0.2", path = "../../crates/tucket" }
selvage = { version = "0.1.0", path = "../../crates/selvage" }
serde = { version = "1", features = ["derive"] }
zeroize = "1"
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
pandect = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
# Application choice and authoring use the existing shared stack.
tabard = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
tabard-workshop = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651", features = ["native-host"] }
directories = "6"
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tulle = { version = "0.2.0", path = "../../crates/tulle", features = ["serial-async"] }

[dev-dependencies]
outrider = { path = "../../crates/outrider" }
# The accessibility receipt asserts against the projection the AccessKit
# adapter is handed, so it names AccessKit's own types.
accesskit = "0.24"
# The live bench receipt's announcing peer: a plain Postilion station with a
# short-lived random identity on the second attached board.
retinue = { version = "0.3.0", path = "../../crates/retinue" }
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand" }
getrandom = "0.3"

# Genet's graph needs the same patches its own workspace applies; a `[patch]`
# table does not inherit through a git dep. Taffy is the one vendored fork still
# taken from genet.git, at the same revision (the Stylo-rename adapter retired
# with Stylo at genet 55c05d11; ipc-channel left this graph by genet 15713014).
[patch.crates-io]
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
mere-proofs = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
# Gaz and Mere exchange one Muniment family.
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "864757da78214bdd810e17355df5b2309721d651" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", rev = "c74b7cb28090c28b1c6d80b08dcdea18aff48d3e" }
# Standalone roots must restate the qualified renderer patches.
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
# Genet renamed its vendored Taffy package to `genet-taffy` after the revision
# this workspace used to pin, so the patch must name the package explicitly
# while keeping the `taffy` dependency alias Cargo expects.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
# mere-signalman's control codec calls `decode_cbor_strict`, which only Mere's
# p2panda fork carries. Restate mere's row for the one p2panda package this
# graph reaches, at the same immutable tag.
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
# No `parley` row: since genet 5ae30cad the fork is published as
# `genet-parley`, nothing in genet answers to `parley`, and a patch row would
# fail resolution (mere's own [patch.crates-io] says the same).

# mere-signalman names the Retinue family from an exact Git revision so its
# manifest works in a clean Mere checkout. Redirect every directly named
# type-bearing member to this workspace: the desktop and private port must
# exchange one Retinue/Postilion/radio-hand family.
[patch."https://github.com/merely-made/murm.git"]
# outrider joined the list 2026-09-02: mere-signalman now names it directly,
# and without the redirect two `outrider::codec::LxmfPayload`s land and
# `Station::send_payload` stops type-checking against the port.
outrider = { path = "../../crates/outrider" }
postilion = { path = "../../crates/postilion" }
retinue = { path = "../../crates/retinue" }
radio-hand = { path = "../../crates/radio-hand" }

selvage = { path = "../../crates/selvage" }
seneschal = { path = "../../crates/seneschal" }
tulle = { path = "../../crates/tulle" }

[workspace.package]
