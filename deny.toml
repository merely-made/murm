# cargo-deny configuration — the license gate.
#
# The workspace is MPL-2.0 (see LICENSE). MPL is *file-level* copyleft: modifications to these
# files must be published, but the crates remain consumable by larger works under other
# licenses. See the licensing ruling in
# design_docs/2026-07-20_mesh_household_tulle_tucket_sennet.md.
#
# retinue and outrider (from 2026-10-05) and tulle and radio-hand (from 2026-10-09) are the
# exceptions: they are under the Reticulum License
# (design_docs/2026-10-05_reticulum_license_adoption.md). That license has no SPDX
# identifier, so these crates declare `license-file` and are clarified below as
# `LicenseRef-Reticulum`. The clarification is pinned to the license file's hash, so an edit
# to either LICENSE fails this check until it is reviewed here.
#
# The load-bearing rule this file enforces is about the DEPENDENCY tree: it must stay free of
# strong copyleft. A GPL/LGPL/AGPL dependency would relicense any firmware or application
# that links retinue, and GPL cannot be combined with the Reticulum License's use
# conditions at all.
#
# `cargo deny check licenses` runs this in CI: any license not on the allow list below fails
# the build, so the boundary cannot erode by accident through a transitive dependency.

[graph]
# Check optional dependencies too (tokio, getrandom, bzip2), so nothing hides behind a
# feature flag.
all-features = true

# Two versions of one crate in a build are a defect: move the older version's
# holder forward. Each skip below is a duplicate that cannot be removed from
# here yet, with the holder that keeps it and what would remove it.
#
#   cargo deny check bans
[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
  { crate = "bitfield@0.13.2", reason = "cortex-m 0.7.10 requires it; cortex-m 0.7.10 (latest) under embassy-executor (heltec firmware via esp-rtos 0.3) holds it; goes when cortex-m moves to bitfield 0.19" },
  { crate = "bitflags@1.3.2", reason = "defmt 1.2.0 requires it; defmt 1.2.0 (firmware) holds it; goes when defmt moves to bitflags 2" },
  { crate = "block-buffer@0.10.4", reason = "digest 0.10.7 requires it; digest 0.10 under esp-hal 1.1.2 (heltec firmware) holds it; goes with esp-hal 1.2" },
  { crate = "crypto-common@0.1.7", reason = "digest 0.10.7 requires it; digest 0.10 under esp-hal 1.1.2 (heltec firmware) holds it; goes with esp-hal 1.2" },
  { crate = "darling@0.20.11", reason = "embassy-executor-macros 0.8.0 requires it; embassy-executor-macros 0.8 and enumset_derive 0.15 (firmware) hold it; goes as they move to darling 0.24" },
  { crate = "darling@0.21.3", reason = "enumset_derive 0.15.1 requires it; embassy-executor-macros 0.8 and enumset_derive 0.15 (firmware) hold it; goes as they move to darling 0.24" },
  { crate = "darling_core@0.20.11", reason = "darling 0.20.11, darling_macro 0.20.11 require it; darling of the same line (embassy-executor-macros, enumset_derive) holds it; goes with darling 0.24" },
  { crate = "darling_core@0.21.3", reason = "darling 0.21.3, darling_macro 0.21.3 require it; darling of the same line (embassy-executor-macros, enumset_derive) holds it; goes with darling 0.24" },
  { crate = "darling_macro@0.20.11", reason = "darling 0.20.11 requires it; darling of the same line holds it; goes with darling 0.24" },
  { crate = "darling_macro@0.21.3", reason = "darling 0.21.3 requires it; darling of the same line holds it; goes with darling 0.24" },
  { crate = "digest@0.10.7", reason = "esp-hal 1.1.2 requires it; esp-hal 1.1.2 (heltec firmware; esp-rtos 0.3 keeps it below 1.2.2) holds it; goes when the firmware's ESP stack moves to esp-hal 1.2 (needs the xtensa toolchain to check, not available here)" },
  { crate = "embassy-hal-internal@0.4.0", reason = "embassy-embedded-hal 0.6.0 requires it; embassy-embedded-hal 0.6.0 under embassy-nrf 0.11 (t114 firmware) holds it; goes when embassy-embedded-hal moves to 0.5" },
  { crate = "embassy-sync@0.6.2", reason = "esp-sync 0.2.1 requires it; esp-sync 0.2.1 (heltec firmware) holds it; goes with the ESP 1.2 line" },
  { crate = "embassy-sync@0.7.2", reason = "esp-sync 0.2.1 requires it; esp-sync 0.2.1 (heltec firmware) holds it; goes with the ESP 1.2 line" },
  { crate = "embedded-hal@0.2.7", reason = "cortex-m 0.7.10, embassy-embedded-hal 0.6.0, embassy-nrf 0.11.0, embassy-time 0.5.1 and others require it; cortex-m 0.7, embassy-embedded-hal 0.6, embassy-nrf 0.11, embassy-time 0.5 and esp-synopsys-usb-otg (firmware) hold it; goes as they drop embedded-hal 0.2" },
  { crate = "embedded-io@0.6.1", reason = "embedded-io-async 0.6.1, esp-hal 1.1.2 require it; embedded-io-async 0.6 and esp-hal 1.1.2 (heltec firmware) hold it; goes with the ESP 1.2 line" },
  { crate = "embedded-io-async@0.6.1", reason = "embassy-sync 0.6.2, embassy-sync 0.7.2, embassy-usb-driver 0.2.2, esp-hal 1.1.2 require it; embassy-sync 0.6/0.7, embassy-usb-driver 0.2 and esp-hal 1.1.2 (firmware) hold it; goes with the ESP 1.2 line" },
  { crate = "esp-metadata-generated@0.4.0", reason = "esp-config 0.7.0, esp-backtrace 0.19.0, esp-bootloader-esp-idf 0.5.0, esp-hal 1.1.2 and others require it; esp-hal 1.1.2, esp-rtos 0.3, esp-sync 0.2 and the other ESP 1.1-line crates (heltec firmware) hold it; goes when the firmware's ESP stack moves to the 1.2 line" },
  { crate = "esp32s3@0.35.2", reason = "esp-hal 1.1.2, tulle-heltec-v4-phy 0.0.1 require it; esp-hal 1.1.2 and the heltec firmware hold it while esp-rom-sys 0.1.5 takes 0.36; goes when the firmware moves to esp-hal 1.2 and esp32s3 0.36 together (not checkable on this host)" },
  { crate = "heapless@0.8.0", reason = "embassy-sync 0.6.2, embassy-sync 0.7.2, usb-device 0.3.2 require it; embassy-sync 0.6/0.7 (esp-sync) and usb-device 0.3.2 (firmware) hold it; goes when they move to heapless 0.9" },
  { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1 requires it; png 0.18.1 (latest; radio-face, radio-mirror) holds it; goes when png moves to miniz_oxide 0.9" },
  { crate = "nb@0.1.3", reason = "embedded-hal 0.2.7 requires it; embedded-hal 0.2 (firmware) holds it; goes with embedded-hal 1" },
  { crate = "rand_core@0.6.4", reason = "embassy-nrf 0.11.0, esp-hal 1.1.2 require it; embassy-nrf 0.11 (t114 firmware) and esp-hal 1.1.2 (heltec firmware) hold it; goes when both move to rand_core 0.10" },
  { crate = "rand_core@0.9.5", reason = "embassy-nrf 0.11.0, esp-hal 1.1.2 require it; embassy-nrf 0.11 and esp-hal 1.1.2 (firmware) hold it; goes when both move to rand_core 0.10" },
  { crate = "rustc_version@0.2.3", reason = "bare-metal 0.2.5 requires it; bare-metal 0.2.5 under cortex-m 0.7 (firmware) holds it; goes when cortex-m drops bare-metal 0.2" },
  { crate = "semver@0.9.0", reason = "rustc_version 0.2.3 requires it; rustc_version 0.2 under bare-metal 0.2.5 (cortex-m) holds it; goes with it" },
  { crate = "syn@2.0.119", reason = "cortex-m-macros 0.7.8, curve25519-dalek-derive 0.1.1, darling_core 0.20.11, darling_core 0.21.3 and others require it; most proc-macros still on syn 2; goes as they move to syn 3" },
  { crate = "windows-link@0.2.1", reason = "windows-sys 0.61.2 requires it; windows-sys 0.61.2 (latest) holds it; goes when windows-sys moves to the windows-link 0.100 line" },
]

[licenses]
version = 2
# Exactly the licenses currently in the tree — kept tight on purpose. A new dependency that
# introduces any other license fails this check, forcing a review:
#
#   * A permissive one (ISC, BSD-2-Clause, Zlib, ...) is a one-line, reviewed addition here.
#   * GPL/LGPL/AGPL is the hard red line: strong copyleft would relicense any firmware image
#     or application that links retinue. Never add it.
#   * MPL-2.0 is allowed: it is what the workspace is licensed under, and its file-level scope
#     does not relicense a combined work.
#   * LicenseRef-Reticulum is allowed for retinue, outrider, tulle and radio-hand only, through the clarify
#     entries below. A third-party crate that declares it still needs its own review.
#
# bzip2-1.0.6 is the permissive bzlib license.
allow = [
    "MPL-2.0",
    "MIT",
    # ISC is permissive and MIT-equivalent (the OpenBSD license). It arrives with the RISC-V
    # runtime crates (riscv, riscv-pac, riscv-rt, riscv-target-parser) that esp-hal pulls in
    # for the firmware members; reviewed and added when the radio family merged.
    "ISC",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "LicenseRef-Reticulum",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "retinue"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "LICENSE", hash = 0xa9865ee2 }]

[[licenses.clarify]]
crate = "outrider"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "LICENSE", hash = 0xed9a75e2 }]

[[licenses.clarify]]
crate = "tulle"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "LICENSE", hash = 0xa9865ee2 }]

[[licenses.clarify]]
crate = "radio-hand"
expression = "LicenseRef-Reticulum"
license-files = [{ path = "LICENSE", hash = 0xa9865ee2 }]

# Per-crate exceptions for the native/ workspace (iroh, p2panda and the embedded emissary
# router), checked by CI's licenses-native job with this file. Each license is permissive,
# and each is allowed only for the crates named here (owner's choice, 2026-10-22), so the
# allow list above stays as tight as the radio and firmware graph needs, and a new crate
# under one of these licenses still fails until it is reviewed.
[[licenses.exceptions]]
crate = "async_io_stream"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "pharos"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "ws_stream_wasm"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[[licenses.exceptions]]
crate = "spez"
allow = ["BSD-2-Clause"]

[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Via emissary-core.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]
