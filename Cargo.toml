[workspace]
resolver = "2"
members = [
    "apps/linkboy",
    "apps/signalman",
    "crates/postilion",
    "crates/retinue",
    "crates/tulle",
    "crates/tinyssb-core",
    "crates/selvage",
    "crates/seneschal",
    "crates/sennet",
    "crates/tucket",
    "crates/outrider",
    "crates/radio-face",
    "crates/radio-hand",
    "crates/radio-mirror",
    "crates/retinue-sim",
    "firmware/heltec-v4-phy",
    "firmware/t114-phy",
    "testing/protocol-capacity",
]

# `apps/signalman-desktop` is deliberately NOT a member.
#
# Its host is genet's, taken from genet.git at an exact revision, and genet's
# graph needs genet's own `[patch]` table — the vendored taffy, stylo_taffy,
# and ipc-channel forks. A `[patch]` does not inherit through a git dep, so
# membership would mean carrying those entries in THIS root manifest and
# dragging the whole engine graph into every ordinary retinue build, including
# the MSRV job that exists to hold a promise about six published crates.
#
# So it excludes itself and roots its own workspace. That is the staged
# delivery the Signalman scope calls for, at its strongest: the default build,
# the lockfile, and CI are untouched, and it can be built deliberately with
#
#   cargo build --manifest-path apps/signalman-desktop/Cargo.toml
#
# It reaches `signalman` and `linkboy` by relative path, which is not a
# cross-checkout dependency — they are in this repository.
# Vendored upstream crates are path dependencies, not members: CI lints members with
# -D warnings, and upstream code is patched only where a defect forces it (156d3bb).
# Membership made every new rustc lint in vendored code a CI failure (Rust 1.99, 2026-10-03).
exclude = [
    "native",
    "wire",
    "apps/signalman-desktop",
    # Bounded retained-repair host prototype has its own pinned codec graph.
    "crates/retained-repair",
    "vendor/embedded-graphics",
    "vendor/embedded-graphics-core",
    "vendor/lora-phy",
]

# Firmware targets thumbv7em/xtensa and is built by name, not by default:
#   cargo build -p tulle-t114-phy --release --target thumbv7em-none-eabihf
default-members = [
    "apps/linkboy",
    "apps/signalman",
    "crates/postilion",
    "crates/retinue",
    "crates/tulle",
    "crates/tinyssb-core",
    "crates/selvage",
    "crates/seneschal",
    "crates/sennet",
    "crates/tucket",
    "crates/outrider",
    "crates/radio-face",
    "crates/radio-hand",
    "crates/radio-mirror",
    "crates/retinue-sim",
]

[workspace.package]
# Shared family MSRV, independent of the Rust 1.99.0 working toolchain.
# Native, browser and embedded configurations are qualified separately.
rust-version = "1.97.1"

# Inherited from the tulle workspace at the 2026-07-23 radio-family merge, and
# kept byte-identical: the firmware images are flash-size-bound, and `lto` and
# `opt-level` cannot be overridden per package. Host crates in this workspace
# build release at `opt-level = "s"` as a consequence. This does not reach
# consumers — profile settings apply only from the root of the build, so mere
# builds retinue under its own profiles.
[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1

# Signalman comms adopts the published Mere/Murm supplier family. Root patches
# are explicit because Cargo does not inherit them from Git dependencies.
[patch.crates-io]
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/mere.git", branch = "main" }

[patch."https://github.com/merely-made/mere.git"]
