[workspace]
resolver = "2"
members = ["crates/wire", "crates/rtc"]
# Keep the ordinary HTTP/WebSocket build unchanged; select RTC explicitly.
default-members = ["crates/wire"]

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
