name: Transport conformance

on:
  push:
    paths:
      - "testing/transport-conformance/**"
      - ".github/workflows/transport-conformance.yml"
  pull_request:
    paths:
      - "testing/transport-conformance/**"
      - ".github/workflows/transport-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testing/transport-conformance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Verify corpus and scoped cases
        run: cargo test --locked --offline
      - name: Record per-case evidence
        run: |
          mkdir -p results
          cargo run --locked --offline -- --output results/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: transport-conformance-${{ github.sha }}
          path: testing/transport-conformance/results/ci.json
          if-no-files-found: error
