# house hooks --no-decisions --bans . --bans native --bans apps/signalman-desktop --bans crates/station-custody --bans crates/pipit --bans crates/retained-repair --clippy-base '-p postilion -p retinue -p tulle -p selvage -p seneschal -p outrider -p radio-face -p radio-hand -p radio-mirror -p retinue-sim -p truchman --all-targets'
# Written by `house hooks` (eidetic, crates/house); `house hooks --check` fails when this file drifts from it.
# `house` is on the PATH: cargo install --git https://github.com/merely-made/eidetic house
fail_fast: true
default_install_hook_types: [pre-commit, post-commit, pre-push]
# Hooks without stages run at pre-commit only, so the notes push inside
# `house resolved push` reruns nothing but that hook.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: house line-ceiling
        language: system
        types: [text]
        always_run: true
      - id: clippy
        name: clippy
        entry: cargo clippy -p postilion -p retinue -p tulle -p selvage -p seneschal -p outrider -p radio-face -p radio-hand -p radio-mirror -p retinue-sim -p truchman --all-targets
        language: system
        files: '(^|/)(Cargo\.toml|rust-toolchain\.toml|[^/]+\.rs)$'
        pass_filenames: false
      - id: dependency-bans
        name: dependency bans
        entry: cargo deny --workspace --all-features check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-native
        name: dependency bans native
        entry: cargo deny --manifest-path native/Cargo.toml --workspace --all-features --config native/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-apps-signalman-desktop
        name: dependency bans apps/signalman-desktop
        entry: cargo deny --manifest-path apps/signalman-desktop/Cargo.toml --workspace --all-features --config apps/signalman-desktop/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-crates-station-custody
        name: dependency bans crates/station-custody
        entry: cargo deny --manifest-path crates/station-custody/Cargo.toml --workspace --all-features --config crates/station-custody/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-crates-pipit
        name: dependency bans crates/pipit
        entry: cargo deny --manifest-path crates/pipit/Cargo.toml --workspace --all-features --config crates/pipit/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-bans-crates-retained-repair
        name: dependency bans crates/retained-repair
        entry: cargo deny --manifest-path crates/retained-repair/Cargo.toml --workspace --all-features --config crates/retained-repair/deny.toml check -D unmatched-skip bans
        language: system
        pass_filenames: false
        always_run: true
      # No Cargo.lock is tracked; what cargo resolved rides on each commit as a
      # git note under refs/notes/resolved (`house resolved show <commit>`).
      - id: record-resolved
        name: record resolved versions
        entry: house resolved record
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
      - id: push-resolved
        name: push resolved versions
        entry: house resolved push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
