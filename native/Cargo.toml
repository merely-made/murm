[workspace]
resolver = "2"
members = ["crates/murm", "crates/transport", "crates/webrtc-carrier"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"

[workspace.dependencies]
transport = { package = "mere-transport", version = "0.0.2", path = "crates/transport" }
retinue = { version = "0.3.0", path = "../crates/retinue" }
blake3 = "1"
serde_json = "1"
hkdf = "0.13"
sha2 = "0.11"
identity = { package = "personae", version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { package = "insigne", version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { package = "notochord", version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
muniment = { package = "muniment", version = "0.1.2", git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
stickleback = { package = "stickleback", version = "0.1.1", git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }
luggage = { package = "luggage", version = "0.1.0", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "543f5ff38f87a09afc04dbc59f57c2dfbc6a9943" }

