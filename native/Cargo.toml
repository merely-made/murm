[workspace]
resolver = "2"
members = ["crates/murm", "crates/murm-i2p", "crates/holder", "crates/resolve", "crates/comms", "crates/sync", "crates/transport", "crates/webrtc-carrier", "crates/ocapn"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"

[workspace.dependencies]
murm-sync = { version = "0.0.1", path = "crates/sync" }
transport = { package = "mere-transport", version = "0.0.2", path = "crates/transport" }
retinue = { version = "0.3.0", path = "../crates/retinue" }
blake3 = "1"
serde_json = "1"
hkdf = "0.13"
sha2 = "0.11"
identity = { package = "personae", version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { package = "insigne", version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { package = "notochord", version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
muniment = { package = "muniment", version = "0.2", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { package = "stickleback", version = "0.4", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
luggage = { package = "luggage", version = "0.1.0", default-features = false, git = "https://github.com/merely-made/eidetic.git", branch = "main" }

# Root patches keep one supplier source and type identity across the graph.
[patch.crates-io]
# Promoted sources shared with immutable older Mere suppliers.
# Canonical promoted families; keep registry and Git consumers type-identical.
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }

# Preserve the I2P3 mitigation: emissary-core 0.4.0 can reach debug_assert!(false)
# from a peer's message. Release builds reject that message; dev/test hosts must
# do the same. The I2P plan records the original failure and the owner's decision.
[profile.dev.package.emissary-core]
debug-assertions = false

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

