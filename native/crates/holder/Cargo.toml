[package]
name = "murm-holder"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Release-log holders: acquire and retain verified editions, acknowledge custody, select pools."
publish = false

[features]
# Carrier adapters are opt-in. Memory and Noise-over-TCP need nothing more.
reticulum = ["murm-resolve/reticulum", "transport/reticulum"]

[dependencies]
getrandom = "0.4"
identity.workspace = true
murm-resolve = { path = "../resolve" }
murm-sync.workspace = true
muniment.workspace = true
stickleback.workspace = true
thiserror = "1"
tokio = { version = "1", features = ["io-util", "time"] }
transport = { workspace = true, features = ["sync-lane"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time", "net"] }
transport = { workspace = true, features = ["sync-lane", "test-identity"] }

[lints]
workspace = true
