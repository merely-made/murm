[package]
name = "murm-ocapn"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded two-party CapTP sessions on already admitted ordered streams"

[features]
default = []
suite-fixture = ["tokio/net"]
native = ["dep:transport", "dep:identity", "dep:insigne", "dep:notochord"]

[dependencies]
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }
futures-util = "0.3"
ed25519-dalek = "3"
getrandom = "0.4"
zeroize = "1"
thiserror = "1"
transport = { workspace = true, features = ["noise", "notochord"], optional = true }
identity = { workspace = true, optional = true }
insigne = { workspace = true, optional = true }
notochord = { workspace = true, features = ["tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }

[[example]]
name = "suite_server"
required-features = ["suite-fixture"]

[[test]]
name = "native_endpoint"
required-features = ["native"]

[lints]
workspace = true
