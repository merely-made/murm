[package]
rust-version = "1.97.1"
name = "murm-i2p"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "An embedded emissary I2P router for murm hosts, handing out its SAMv3 bridge."

[dependencies]
emissary-core = "0.4.0"
emissary-util = "0.4.0"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
truchman = { version = "0.1.1", path = "../../../crates/truchman" }

[dev-dependencies]
retinue = { workspace = true, features = ["i2p"] }
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std", "net"] }
