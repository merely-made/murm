[package]
rust-version = "1.97.1"
name = "murm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Direct peer-to-peer conversation service for the Mere browser."
documentation = "https://docs.rs/murm"
readme = "README.md"
keywords = ["p2p", "messaging", "bilateral", "comms", "browser"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[features]
default = []
# The point-to-point session lane: owner-gated inbound sessions carrying posts
# (Notochord N2). Off by default because the ordinary peer runtime is
# topic-shaped; this is what a bearer without a gossip overlay needs.
session-lane = ["dep:notochord", "transport/notochord"]

[dependencies]
# Path + version: path for local workspace builds; version for `cargo publish`.
identity.workspace = true
muniment = { path = "../../eidetic/muniment", features = ["redb"] }
stickleback = { workspace = true }
transport.workspace = true
notochord = { workspace = true, features = ["tokio"], optional = true }
blake3 = "1.5"
hex = "0.4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# `p2panda-core` supplies the operation and header types murm's own grammar is
# built on. LogSync (offline catch-up) is no longer assembled here:
# `stickleback::JoinedSpace` owns that ceremony, so the protocol
# (`p2panda-net`) and its sync-event types (`p2panda-sync`) went unreferenced
# and were dropped 2026-07-26. Murm owns the operation grammar, store, session,
# and received-operation admission path.
p2panda-core = "0.7.0"
proofs.workspace = true
p2panda-encryption = { version = "0.7.0", default-features = false }
zeroize = "1"
# `rt` for the sync tasks (`tokio::spawn`); `time` bounds the manual `resync`
# round; `sync` for the cabal `subscribe` broadcast receiver; `tokio-stream` for
# the gossip subscription stream (the LogSync one is the drain's now).
tokio = { version = "1", features = ["io-util", "rt", "time", "sync"] }
tokio-stream = "0.1"
thiserror = "1"

[dev-dependencies]
# Tests and examples bind throwaway identities (vault lock plan, ruling 96).
transport = { workspace = true, features = ["test-identity"] }
insigne = { workspace = true, features = ["verify"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"
