[package]
rust-version = "1.97.1"
name = "mere-comms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The portable comms model: conversations, messages, identities and local drafts, with opt-in Misfin and Murm adapters and a Moot Commons-chat consumer."
documentation = "https://docs.rs/comms"
keywords = ["graphshell", "comms", "messaging", "mere", "domain"]
categories = ["gui"]

[lib]
name = "comms"
path = "src/lib.rs"

[features]
# The in-memory adapter is a useful test double for downstream crates (the host
# pane, a comms service). Available to this crate's own tests unconditionally.
test-support = []
# The murm adapter: cabals → conversations, posts → messages, live subscribe.
# Pulls murm (tokio + iroh transport), so it is opt-in and absent from a wasm
# build of the bare model.
murm-adapter = ["dep:murm"]
# The misfin adapter: a mailbox → conversations, gemmail → messages. Pulls the
# misfin server feature (tokio + redb), so likewise opt-in.
misfin-adapter = ["dep:misfin"]

[dependencies]
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
murm = { version = "0.0.1", path = "../murm", optional = true }
# The misfin adapter reads the receive server's mailbox, so it needs the
# `server` feature (MailboxStore + ReceivedMessage). Errand owns misfin.
misfin = { version = "0.0.4", git = "https://github.com/merely-made/errand.git", branch = "main", optional = true, features = ["ring", "server"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
serde_json = "1"
# Build canned signed posts for the murm-adapter tests (keypairs + sign_post).
# Light (ed25519 + blake3), no transport/iroh.
identity = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native adapter receipt uses real Murm handles over an in-process transport.
# Keep this fixture outside the portable model's Wasm dependency cone.
transport = { workspace = true }

[lints]
workspace = true
