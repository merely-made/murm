[package]
rust-version = "1.97.1"
name = "mere-transport"
readme = "README.md"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Peer transport layer for the Mere browser — iroh-based authenticated encrypted QUIC streams between known peers."
documentation = "https://docs.rs/transport"
keywords = ["transport", "iroh", "p2p", "quic", "browser"]
categories = ["network-programming"]

[features]
# Optional Reticulum transport backend for off-grid / mesh links. Disabled by
# default; enable to build and test `ReticulumTransport`. Backed by `retinue`,
# Mark's own RNS implementation; `hkdf`/`sha2` derive the retinue identity.
reticulum = ["dep:retinue", "dep:hkdf", "dep:sha2"]
# A Noise session layer: a second, application-layer handshake that runs inside
# a stream a carrier already opened. Off by default. It is not an alternative
# to the iroh lane -- iroh stays the byte plane, and Noise composes over it for
# an application identity distinct from the carrier's. Iroh already encrypts
# through its relays. Noise also stands alone over plain TCP.
noise = ["dep:snow", "dep:hkdf", "dep:sha2"]
# Conversion from this crate's acceptance record into the notochord
# layer's carrier facts. The dependency runs in this direction on purpose:
# `notochord` stays carrier-neutral and never learns about iroh, p2panda,
# or retinue, which is what keeps the cycle from forming (Notochord N1).
notochord = ["dep:notochord"]
# `P2pandaTransport::builder(&Ed25519Keypair)`, for tests, examples and probes
# with throwaway identities. Production binds from a personae
# `DerivedKeypair` through `builder_for`, so a master cannot reach a transport
# (vault lock plan, ruling 96). Turn it on in dev-dependencies only.
test-identity = []

[lib]
name = "transport"
path = "src/lib.rs"

[dependencies]
# Path + version: path is used during local workspace builds; version is
# required for `cargo publish` to record the crates.io dependency.
identity.workspace = true
# `time` paces `endpoint_addr`'s brief wait for iroh's interface discovery.
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }
snow = { version = "0.10", optional = true }
thiserror = "1"
tracing = "0.1"
# iroh 1.0 wraps quinn QUIC. The 1.0.3 floor matters: 1.0.2 exact-pinned
# ed25519-dalek =3.0.0-rc.0, which blocked the dalek 3.0/5.0 finals from
# resolving; 1.0.3 relaxed it to a range. personae and retinue have since
# migrated their own key handling to dalek 3, so iroh, p2panda, personae, and
# retinue now share one copy. A dalek 2 copy still enters the graph under
# ssh-key 0.6 (ed25519-dalek 2.2 -> curve25519-dalek 4.1); that lane stays
# separate, crossed via raw 32-byte seeds, and retires with an ssh-key release
# on dalek 3.
iroh = "1.0.3"
iroh-blobs = "0.103"
# Shareable connection tickets: serialize this node's `EndpointAddr` to a string
# a peer can paste to dial it (the explicit-bootstrap path, e.g. a host's
# "connect to peer" verb), and parse it back. Pairs with `add_peer` / `set_topics`.
iroh-tickets = "1.0"
bytes = "1"
n0-future = "0.3"
# p2panda-net is the production endpoint authority (P2pandaTransport); it
# pins iroh 1.0, unifying with the iroh/iroh-blobs deps above.
muniment.workspace = true
stickleback.workspace = true
# Every p2panda-net feature except `sqlite`. The address book runs on
# stickleback's muniment-backed store, so p2panda-store's bundled SQLite
# backend (and sqlx with it) stays out of the graph entirely. Feature
# unification means EVERY consumer has to opt out, not just one.
p2panda-net = { package = "mere-p2panda-net", version = "=0.7.5", default-features = false, features = [
  "address_book",
  "iroh_endpoint",
  "iroh_mdns",
  "discovery",
  "gossip",
  "sync",
] }
p2panda-core = "0.7.0"
# The builder's held seed is cleared on drop (vault lock ruling 51).
zeroize = "1"
# Reticulum mesh-networking backend (optional, see [features]). `retinue` is
# Mark's from-scratch RNS stack; `hkdf`/`sha2` derive its identity from the seed.
retinue = { workspace = true, optional = true }
notochord = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# The notochord integration test imports feature-gated items; without this
# guard a bare `cargo test -p mere-transport` fails to compile the test file.
[[test]]
name = "notochord"
required-features = ["notochord"]

# Vault lock ruling 51: what a bind leaves of its seed. Personae's tracker
# installs its own global allocator, so this runs outside libtest.
[[test]]
name = "seed_residue"
path = "tests/seed_residue.rs"
harness = false

[dev-dependencies]
insigne = { workspace = true, features = ["verify"] }
# The seed residue test's tracker (personae's) runs its own positive control.
serde_json.workspace = true
zeroize = "1"
notochord = { workspace = true, features = ["tokio"] }
# The seed residue test's iroh-level mDNS baseline (vault lock ruling 60), the
# version p2panda-net's `iroh_mdns` already locks.
iroh-mdns-address-lookup = "=0.6.0"
# A scratch root for the disk-backed blob store's reopen test.
tempfile = "3"
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
