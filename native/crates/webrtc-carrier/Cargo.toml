[package]
rust-version = "1.97.1"
name = "murm-webrtc"
readme = "README.md"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasm-clean core for the Mere browser WebRTC carrier — bounded frames, invitation ids, role-tagged DTLS fingerprints, and the link-challenge transcript that derives Notochord's shared link."
documentation = "https://docs.rs/webrtc-carrier"
keywords = ["webrtc", "carrier", "browser", "wasm", "notochord"]
categories = ["network-programming"]

[features]
# The default build is the shared core, and it is the half that has to
# compile for `wasm32-unknown-unknown` byte-for-byte identically to native: no
# tokio, no sockets, no OS randomness, no wasm-bindgen. Every nonce and every
# fingerprint is an *input* — this crate computes over them, it never
# generates them, so it needs neither an RNG nor a clock.
default = []

# The browser C1 adapter: a `web_sys::RtcPeerConnection` initiator over the
# core above, in `src/browser/`. Off by default so the Wasm-clean core stays
# the thing every consumer gets without asking, and so `cargo check --target
# wasm32-unknown-unknown` with no features stays a C0 receipt this feature
# cannot break.
#
# Every dependency it needs is declared only under
# `[target.'cfg(target_arch = "wasm32")']` below, `dep:`-gated so enabling
# `browser` on a native target activates nothing — the same shape
# `muniment`'s `indexeddb` feature already uses in this workspace for exactly
# the same reason. The native C1 adapter (`native`, on a pinned webrtc-rs or
# str0m answerer) is a sibling feature landing separately in `src/native/`.
browser = [
    "dep:futures-channel",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

# The native C1 adapter: a str0m answerer driven over a tokio UDP socket, in
# `src/native/`. Off by default, and it stays that way — a socket, a runtime,
# an OS clock and a DTLS stack are precisely what the Wasm-clean default build
# refuses to contain, so `cargo check --target wasm32-unknown-unknown` with no
# features remains a C0 receipt this feature cannot break.
#
# Its dependencies are declared only under
# `[target.'cfg(not(target_arch = "wasm32"))']` below, `dep:`-gated for the
# same reason `browser`'s are: enabling `native` for a wasm32 target activates
# nothing, and `src/native/` is compiled out to match.
native = ["dep:str0m", "dep:tokio"]

[lib]
name = "webrtc_carrier"
path = "src/lib.rs"

[dependencies]
# The one hash in the crate, and it hashes exactly one thing: the transcript.
# (DTLS fingerprints are SHA-256 by RFC 8122, but they arrive as 32 bytes and
# are never computed here.) blake3 because `graphshell::browser_carrier`
# already derives its transcript link with it into the same Notochord slot —
# one link-derivation discipline in the repo, not two. Pure Rust, builds for
# `wasm32-unknown-unknown` with no feature coaxing.
blake3.workspace = true
thiserror = "1"

# Release identity has one definition in this workspace, and it is Luggage's.
# `default-features = false` takes the release-identity core only — no feed
# configuration, no network, no filesystem, nothing that fails to build for
# `wasm32-unknown-unknown`. The updater pipeline lives behind Luggage's
# `native` feature and is deliberately not enabled here: this crate names a
# release, it never fetches or installs one.
#
# The alternative was a second `ReleaseRefV1` maintained by hand on this side.
# Two definitions of an identity that crosses a trust boundary drift silently
# and are wrong exactly when it matters.
#
# The workspace declaration already carries `default-features = false` — Cargo
# forbids a member turning workspace defaults off, so that posture is set
# there and inherited plainly here.
luggage.workspace = true

# No `subtle`: constant-time identifier comparison here is a 20-line fold over
# two byte slices, and the workspace does not otherwise carry that crate.

# The browser adapter's JS bridge. Declared for wasm32 only, so enabling
# `browser` on a native build target resolves none of it — mirrors
# `crates/eidetic/muniment`'s `indexeddb` dependency table exactly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The bufferedamountlow wake and the channel-open wait are each one oneshot,
# registered fresh per wait and resolved by whichever event or terminal
# condition fires first — never a polled timer. `alloc`-only: no executor,
# no I/O, nothing this crate does not already pull in some other form.
futures-channel = { version = "0.3", optional = true, default-features = false, features = [
    "alloc",
] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# Trimmed to what `src/browser/` actually calls: the connection and channel
# themselves, their init dicts and state/type enums, session-description and
# ICE-candidate exchange for the offer this module produces and the answer
# and candidates a signaling channel hands back in, and the two event types
# (`MessageEvent`, `RtcPeerConnectionIceEvent`) plus the plain `Event` every
# other handler receives. C3 adds two: `RtcIceTransportPolicy` for the
# forced-relay knob on `RtcConfiguration`, and `RtcOfferOptions` for the
# `iceRestart` flag `create_offer_with_rtc_offer_options` takes — each is its
# own web-sys feature, gating the method/field that needs it, not folded into
# `RtcConfiguration`/`RtcPeerConnection`.
web-sys = { version = "0.3", optional = true, features = [
    "Event",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcOfferOptions",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The `browser` feature's unit tests run under this harness, not `#[test]`:
# `wasm_bindgen_test` is the only runner that exists for
# `wasm32-unknown-unknown`. Target-gated for the same reason the deps above
# are — a native `cargo test` must not need it resolved at all.
wasm-bindgen-test = "0.3"

# The native adapter's engine and runtime. Declared for everything but wasm32,
# so enabling `native` for a browser build resolves none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# str0m 0.23.1, chosen against webrtc-rs on a measured bake-off: 89 crates
# against 212, and 214 MB of added compiled artifacts against 329 MB. The
# deciding argument is not size, though: str0m is Sans-IO, and this codebase
# already runs that way — Notochord's handshake core and this carrier's own
# core are both deliberately I/O-free, so the WebRTC engine being I/O-free too
# leaves exactly one file in the native stack that knows what a socket is.
#
# `default-features = false` drops two things. `examples` pulls rouille and
# rustls for str0m's own demo web server, which has no business in a library
# dependency graph. `aws-lc-rs` is str0m's default crypto backend and builds
# `aws-lc-sys` from C and assembly, needing cmake and a C toolchain on every
# machine and target this crate is built for. `rust-crypto` is the pure-Rust
# backend (dimpl for DTLS over RustCrypto primitives): no build tooling, and
# it cross-compiles wherever rustc does, which is what Mere's five validation
# targets need. It is an evidence result, not a permanent rule — a deployment
# that wants AWS-LC swaps the feature and calls
# `RtcConfig::set_crypto_provider`.
str0m = { version = "0.23.1", optional = true, default-features = false, features = [
    "rust-crypto",
] }
# `net` for the UDP socket, `time` for the Sans-IO loop's clamped waits, `rt`
# to spawn the driver, `sync` for the four channels the handles talk over,
# `macros` for the `select!` that makes one input per turn visible.
# `io-util` is the pump in `src/native/stream.rs`: `duplex`, `split`, and the
# read/write extension traits that present the carrier's frames as the byte
# stream Notochord and the Graphshell session loop both want.
tokio = { version = "1", optional = true, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The loopback test needs a real multi-threaded runtime: it runs two carriers
# and the test body concurrently, and a current-thread runtime would make the
# "does this spin?" measurements meaningless.
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

# The native loopback receipts. `required-features` rather than a `#![cfg]`
# inside, so a default `cargo test` and a wasm32 `--all-targets` check never
# reach the file at all.
[[test]]
name = "native_loopback"
required-features = ["native"]
