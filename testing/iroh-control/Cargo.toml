[package]
name = "iroh-control-probe"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Isolated iroh carrier and durable wall-node control host probe"

[workspace]

[dependencies]
anyhow = "1"
getrandom = "0.3"
heapless = "0.9"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
postilion = { path = "../../crates/postilion" }
radio-hand = { path = "../../crates/radio-hand", features = ["control-retinue"] }
retinue = { path = "../../crates/retinue" }
selvage = { path = "../../crates/selvage" }
seneschal = { path = "../../crates/seneschal", features = ["retinue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
