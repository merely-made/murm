[package]
name = "secure-sessions-n3"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
publish = false
description = "Two-process qualification of Murm admitted secure sessions across ordered carriers"

[workspace]

[dependencies]
anyhow = "1"
transport = { package = "mere-transport", path = "../../native/crates/transport", features = ["noise", "notochord", "reticulum", "test-identity"] }
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[patch.crates-io]
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }

[patch."https://github.com/merely-made/mere.git"]
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
