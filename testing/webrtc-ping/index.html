<!doctype html>
<!--
  The screenshot surface for the C1 headed receipt.

  Everything on this page is a fact the receipt has to record, in text sized to
  survive a screenshot: which stage the connection reached, how many bounded
  ping frames went out and came back, what `bufferedAmount` was, how many ICE
  candidates were kept versus dropped, whether a reconnect resumed by diff or
  snapshot, the current revision, and any error verbatim.

  No CDN, no framework, no external font. The network requests this page makes
  are for its own two files under ./pkg/, the one POST that carries the offer
  SDP to the native fixture (both /offer on CONNECT and the ICE-restart offer on
  RECONNECT), and an optional GET /turn-credentials when MINT FROM FIXTURE asks
  the answerer to mint a short-lived TURN username/credential.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webrtc-ping — C1 headed receipt</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e8ea;
        --dim: #8b8b93;
        --line: #33333c;
        --good: #7ee081;
        --bad: #ff8b7d;
      }
      body {
        margin: 0;
        padding: 2rem clamp(1rem, 4vw, 3rem);
        background: #131318;
        color: var(--ink);
        font: 400 17px/1.5 ui-monospace, "Cascadia Mono", "Consolas", monospace;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        letter-spacing: 0.02em;
      }
      #marks {
        color: var(--dim);
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        word-break: break-word;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 6px;
        margin: 0 0 1.5rem;
        padding: 1rem 1.25rem 1.25rem;
      }
      legend {
        color: var(--dim);
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0 0.4rem;
      }
      label {
        color: var(--dim);
        font-size: 0.85rem;
        display: inline-block;
        margin-right: 0.4rem;
      }
      input {
        background: #1c1c23;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        font: inherit;
        padding: 0.35rem 0.5rem;
      }
      input[type="number"] {
        width: 7rem;
      }
      input[type="checkbox"] {
        vertical-align: middle;
        margin-right: 0.3rem;
      }
      #signal-url,
      #turn-url {
        width: min(28rem, 100%);
      }
      #turn-username,
      #turn-credential {
        width: min(16rem, 100%);
      }
      .note {
        color: var(--dim);
        font-size: 0.8rem;
        margin-left: 0.5rem;
      }
      button {
        background: #23232c;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        cursor: pointer;
        font: 600 1rem/1 ui-monospace, "Cascadia Mono", "Consolas", monospace;
        letter-spacing: 0.08em;
        margin: 0.75rem 0.75rem 0 0;
        padding: 0.75rem 1.25rem;
      }
      button:hover {
        border-color: #55556a;
      }
      button:disabled {
        color: var(--dim);
        cursor: default;
      }
      .row {
        margin-top: 0.6rem;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.4rem 1.5rem;
        margin: 0;
      }
      dt {
        color: var(--dim);
        font-size: 1.05rem;
      }
      dd {
        margin: 0;
        font-size: 1.6rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      #state {
        color: var(--good);
      }
      #error {
        color: var(--bad);
        font-size: 1.05rem;
        word-break: break-word;
        min-height: 1.3em;
      }
    </style>
  </head>
  <body>
    <h1>webrtc-ping — C1 headed receipt</h1>
    <div id="marks">loading the bindings…</div>

    <fieldset>
      <legend>Fixture</legend>
      <div class="row">
        <label for="signal-url">signalling</label>
        <input id="signal-url" type="text" value="http://127.0.0.1:8787/offer" />
      </div>
      <div class="row">
        <label for="frame-count">frames</label>
        <input id="frame-count" type="number" min="1" max="10000" value="16" />
        <label for="frame-bytes">payload bytes</label>
        <input id="frame-bytes" type="number" min="9" max="65536" value="1024" />
      </div>
      <div class="row">
        <button id="connect">CONNECT</button>
        <button id="send">SEND N FRAMES</button>
        <button id="reconnect">RECONNECT</button>
        <button id="close">CLOSE</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>TURN / relay (C3)</legend>
      <div class="row">
        <label for="turn-url">TURN url</label>
        <input
          id="turn-url"
          type="text"
          placeholder="turn:host:3478?transport=udp  (blank = direct)"
        />
      </div>
      <div class="row">
        <label for="turn-username">username</label>
        <input id="turn-username" type="text" placeholder="minted &lt;expiry&gt;:mere" />
        <label for="turn-credential">credential</label>
        <input id="turn-credential" type="text" placeholder="minted base64 token" />
      </div>
      <div class="row">
        <label for="relay-only">
          <input id="relay-only" type="checkbox" />
          force relay-only ICE
        </label>
        <button id="mint">MINT FROM FIXTURE</button>
        <span id="mint-status" class="note"></span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Live</legend>
      <dl>
        <dt>state</dt>
        <dd id="state">booting</dd>
        <dt>frames sent</dt>
        <dd id="frames-sent">0</dd>
        <dt>frames echoed back</dt>
        <dd id="frames-received">0</dd>
        <dt>bytes sent</dt>
        <dd id="bytes-sent">0</dd>
        <dt>bytes received</dt>
        <dd id="bytes-received">0</dd>
        <dt>bufferedAmount</dt>
        <dd id="buffered">0</dd>
        <dt>ICE candidates</dt>
        <dd id="candidates">0 kept / 0 dropped</dd>
        <dt>resume mode</dt>
        <dd id="resume-mode">—</dd>
        <dt>revision</dt>
        <dd id="revision">0</dd>
        <dt>first send → last echo</dt>
        <dd id="elapsed">—</dd>
        <dt>error</dt>
        <dd id="error"></dd>
      </dl>
    </fieldset>

    <script type="module">
      import init, {
        boot,
        connect,
        reconnect,
        send_frames,
        close_session,
        refresh,
      } from "./pkg/webrtc_ping.js";

      const $ = (id) => document.getElementById(id);
      const showError = (err) => {
        $("error").textContent = String(err && err.message ? err.message : err);
      };

      await init();
      boot();

      // The credential-minting endpoint sits next to /offer on the fixture.
      const turnCredsUrl = () =>
        $("signal-url").value.trim().replace(/\/offer\/?$/, "/turn-credentials");

      $("connect").addEventListener("click", async () => {
        $("error").textContent = "";
        $("connect").disabled = true;
        try {
          await connect(
            $("signal-url").value.trim(),
            $("turn-url").value.trim(),
            $("turn-username").value.trim(),
            $("turn-credential").value.trim(),
            $("relay-only").checked,
          );
        } catch (err) {
          showError(err);
        } finally {
          $("connect").disabled = false;
        }
      });

      // Fetch a freshly minted username/credential from the fixture and fill
      // the fields. The long-term secret never leaves the answerer; this is
      // exactly the pair the browser is allowed to hold.
      $("mint").addEventListener("click", async () => {
        $("error").textContent = "";
        $("mint").disabled = true;
        try {
          const response = await fetch(turnCredsUrl());
          const body = await response.text();
          if (!response.ok) {
            throw new Error(`${response.status}: ${body}`);
          }
          const creds = JSON.parse(body);
          $("turn-username").value = creds.username ?? "";
          $("turn-credential").value = creds.credential ?? "";
          if (Array.isArray(creds.urls) && creds.urls.length > 0) {
            $("turn-url").value = creds.urls[0];
          }
          $("mint-status").textContent = `minted, ttl ${creds.ttl}s${
            creds.realm ? ` · realm ${creds.realm}` : ""
          }`;
        } catch (err) {
          $("mint-status").textContent = "";
          showError(err);
        } finally {
          $("mint").disabled = false;
        }
      });

      $("reconnect").addEventListener("click", async () => {
        $("error").textContent = "";
        $("reconnect").disabled = true;
        try {
          await reconnect($("signal-url").value.trim());
        } catch (err) {
          showError(err);
        } finally {
          $("reconnect").disabled = false;
        }
      });

      $("send").addEventListener("click", async () => {
        $("error").textContent = "";
        $("send").disabled = true;
        try {
          await send_frames(
            Number($("frame-count").value),
            Number($("frame-bytes").value),
          );
        } catch (err) {
          showError(err);
        } finally {
          $("send").disabled = false;
        }
      });

      $("close").addEventListener("click", () => {
        try {
          close_session();
        } catch (err) {
          showError(err);
        }
      });

      // `bufferedAmount` only changes as the browser drains SCTP, and no event
      // reports every step of that; a 250 ms repaint is the honest way to show
      // it. Everything else on the page is written by the Rust side the moment
      // it changes.
      setInterval(refresh, 250);
    </script>
  </body>
</html>
