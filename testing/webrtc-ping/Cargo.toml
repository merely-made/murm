# The C1 headed receipt for the browser WebRTC carrier: a real ordinary
# browser opening one ordered, reliable data channel against a real native
# process, exchanging bounded ping frames, and closing cleanly — plan §4's
# first done-condition, and the one no `cargo test` can earn because it needs
# a browser's own ICE agent, DTLS stack, and SCTP association on the other end.
#
# The fixture is deliberately two halves of one crate:
#
#   * `[lib]` (feature `browser`, wasm32) — the page's initiator, built on
#     `webrtc_carrier::BrowserInitiator`;
#   * `[[bin]] answerer` (feature `native`) — the host's answerer, built on
#     `webrtc_carrier::native::Answerer`, plus a ~120-line loopback signalling
#     fixture over a raw `TcpListener`. Plan §4 says local copy/paste or a tiny
#     loopback fixture and keeps public infrastructure out of C1, so there is
#     no HTTP crate here and no signalling service — one POST, one answer.
#
# Standalone: its own workspace root and `Cargo.lock`, outside the Murm
# workspaces. Run with `run.ps1`.
#
# It observes, and never modifies, `native/crates/webrtc-carrier` (`murm-webrtc`).
[package]
name = "webrtc-ping"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/merely-made/murm"
publish = false
description = "C1 headed receipt: a browser data channel against a native str0m answerer, over a loopback signalling fixture."

[workspace]

[lib]
name = "webrtc_ping"
# `cdylib` is what `wasm-bindgen` consumes; `rlib` keeps `cargo build --bin`
# on a native host from having to link a dylib it does not use.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "answerer"
path = "src/bin/answerer.rs"
# So a wasm32 `cargo build --features browser` never reaches this file, and a
# default `cargo build` never resolves tokio or str0m.
required-features = ["native"]

[features]
default = []

# The page half. Every dependency it needs is declared under
# `cfg(target_arch = "wasm32")` only and `dep:`-gated, the same shape
# `webrtc-carrier` itself uses, so enabling `browser` on a native target
# activates nothing.
browser = [
    "murm-webrtc/browser",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

# The host half. Mirror image: declared under `cfg(not(target_arch =
# "wasm32"))` only, so enabling `native` for a browser build resolves none of
# it. `hmac`/`sha1` ride here too: they mint the TURN endpoint's ephemeral
# credentials on the host and have no business in a wasm build.
native = ["murm-webrtc/native", "dep:tokio", "dep:hmac", "dep:sha1"]

[dependencies]
# The crate under test, by path. Default features (the Wasm-clean core) only —
# the two adapters arrive through this crate's own `browser`/`native` features
# above, so neither half can drag the other's dependency graph in.
murm-webrtc = { path = "../../native/crates/webrtc-carrier" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
# CRITICAL PIN. `wasm-bindgen` requires the crate and the `wasm-bindgen` CLI to
# agree on a schema version *exactly*; the installed CLI is 0.2.126, and an
# unpinned "0.2" resolves to 0.2.127, whose binding generation then fails with
# a schema mismatch rather than a version warning. `ports/graphshell/web` and
# `ports/muniment-opfs-probe` pin the same value for the same reason. Pinning
# only this crate is enough: `js-sys`, `web-sys` and `wasm-bindgen-futures`
# each depend on it and resolve down to their 0.3.103/0.4.76 companions on
# their own.
wasm-bindgen = { version = "=0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
# Trimmed to what `src/lib.rs` actually calls: the DOM the page reports into,
# `fetch` for the one POST that carries the offer to the fixture, and
# `performance.now()` for the round-trip figure the receipt quotes.
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Element",
    "Headers",
    "Node",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
    "console",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `rt-multi-thread` deliberately: the signalling fixture is a blocking
# `TcpListener` on its own OS thread handing offers in over a channel, and the
# carrier's driver task must keep turning while that thread is parked in
# `accept()`.
tokio = { version = "1", optional = true, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
# The TURN ephemeral-credential endpoint's HMAC-SHA1. Both are RustCrypto
# crates str0m already pulls in transitively, so they are pinned in this
# crate's `Cargo.lock` (hmac 0.12.1, sha1 0.10.7) before either name appears
# here — declaring them direct resolves nothing new and downloads nothing.
# Native-only, next to the answerer that mints: the long-term secret lives on
# this host and never reaches wasm, which is the whole security point.
# base64 is hand-rolled in `src/bin/answerer.rs` (no base64 crate is in the
# lock, and standard-alphabet encoding is ~15 lines).
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
