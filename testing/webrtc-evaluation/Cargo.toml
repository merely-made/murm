[package]
name = "murm-webrtc-evaluation"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Deliberately outside the radio and native peer workspaces. This measures
# upstream engines without the application, storage or endpoint dependency cone.
[workspace]
resolver = "2"

[lib]
path = "evaluation.rs"

[features]
default = []
rtc-core = ["dep:rtc"]
str0m-core = ["dep:str0m"]
async-api = ["dep:webrtc"]

[dependencies]
rtc = { version = "=0.21.1", optional = true, default-features = false, features = ["crypto-ring"] }
str0m = { version = "=0.23.1", optional = true, default-features = false, features = ["rust-crypto"] }
webrtc = { version = "=0.21.1", optional = true, default-features = false, features = ["runtime-tokio", "crypto-ring"] }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true
