schema = "transport-conformance.cases/v1"
profile = "host-independent-v1"
description = "Official primitive vectors, RFC6330 metadata preflight, bounded composition, and selected independent OpenRQ interoperability"

[[cases]]
id = "blake3.official.all-modes"
specification = "https://github.com/BLAKE3-team/BLAKE3-specs/blob/master/blake3.pdf"
section = "BLAKE3 official test_vectors/test_vectors.json"
evidence_class = "known-answer"
provenance = "official pinned upstream vectors; artifact hashes and license in vectors/manifest.json"
implementation = "blake3 1.8.7"

[[cases]]
id = "ed25519.rfc8032.test-1"
specification = "https://www.rfc-editor.org/rfc/rfc8032.html"
section = "7.1 TEST 1"
evidence_class = "known-answer"
provenance = "RFC8032 published Ed25519 empty-message seed/public-key/signature vector"
implementation = "ed25519-dalek 3.0.0"

[[cases]]
id = "ed25519.rfc8032.tamper"
specification = "https://www.rfc-editor.org/rfc/rfc8032.html"
section = "5.1.7; authored mutations of 7.1 TEST 1"
evidence_class = "negative-vector"
provenance = "suite-authored one-byte message and one-bit signature corruption of published TEST 1"
implementation = "ed25519-dalek 3.0.0 verify_strict"

[[cases]]
id = "raptorq.rfc6330.payload-id"
specification = "https://www.rfc-editor.org/rfc/rfc6330.html"
section = "3.1, 3.2"
evidence_class = "wire-preflight"
provenance = "suite-authored boundary octets derived from normative field widths and network byte order"
implementation = "suite preflight and raptorq 2.0.1 PayloadId"

[[cases]]
id = "raptorq.rfc6330.oti"
specification = "https://www.rfc-editor.org/rfc/rfc6330.html"
section = "3.1, 3.3, 4.2, 4.4.1.2; Verified Technical erratum 5548"
evidence_class = "wire-preflight"
provenance = "suite-authored field/length/parameter cases; https://www.rfc-editor.org/errata/eid5548"
implementation = "suite preflight and raptorq 2.0.1 ObjectTransmissionInformation"

[[cases]]
id = "raptorq.bounded.packet-preflight"
specification = "https://www.rfc-editor.org/rfc/rfc6330.html"
section = "3.2, 4.4.2; suite bounded profile"
evidence_class = "composition"
provenance = "suite-authored exact-one-symbol packet, SBN, ESI, object and <=256 source-symbol/block work bounds; not complete RFC packet reception"
implementation = "suite bounded adapter"

[[cases]]
id = "raptorq.bounded.loss-reorder-duplicate"
specification = "https://www.rfc-editor.org/rfc/rfc6330.html"
section = "4.4.3, 5; bounded same-library scenario"
evidence_class = "composition"
provenance = "suite-generated data encoded and decoded by the same raptorq library; no independent encoder oracle"
implementation = "raptorq 2.0.1"

[[cases]]
id = "raptorq.independent-encoder-interoperability"
specification = "https://www.rfc-editor.org/rfc/rfc6330.html"
section = "4.4.1, 4.4.2, 5, 5.8; selected N=1, Al=1 profile"
evidence_class = "interoperability"
provenance = "suite-authored objects; exact independent OpenRQ output at 45f4437ba96d7e69a6ee05a2e51cf79cda90448e; retained Java decoding of actual Rust packets; vectors/openrq-interop.json and reproducible interop/ campaign"
implementation = "raptorq 2.0.1 Rust versus pinned OpenRQ Java; offline replay does not execute Java"

[[cases]]
id = "raptorq.full-codec-conformance"
specification = "https://www.rfc-editor.org/rfc/rfc6330.html"
section = "complete RFC6330 encoding/decoding and packet reception space"
evidence_class = "conformance"
provenance = "unsupported beyond named profiles; selected independent vectors do not establish complete conformance"
implementation = "not qualified"
