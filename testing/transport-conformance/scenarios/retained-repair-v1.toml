# Authored prototype inputs. These are design experiments, not qualification vectors.
schema = "transport-conformance.simulation-experiments/v1"
id = "retained-repair-frontier-v1"
assumptions = [
 "A slot is an authored scheduling opportunity, with no physical duration or RF modulation assigned.",
 "The transmitter can offer one frame on each ideal independent channel simultaneously; receiver radio count alone does not increase transmitted capacity.",
 "Each independently tuned radio collects at most one channel frame per modeled slot; four radios can cover four channels.",
 "Receivers already know the channel plan, manifest cadence and common slot clock; partial receivers prefer the anchor channel on predicted manifest slots.",
 "T=128, N=1, Al=4; full single-symbol RFC6330 packets are wrapped in authored authenticated frames.",
 "Manifest repeats, signatures and framing consume the recorded slot and wire-byte budget.",
 "The repair floor reserves channel opportunities for round-robin retained generations; zero is an exploratory counterfactual.",
 "Catch-up depends on retention, receive opportunities, offered work and actual decoder success; it is not guaranteed by fountain coding alone."
]

[[experiments]]
id = "finite-burst"
question = "After production stops, can one radio catch up while four radios complete earlier?"
checkpoint_after_slot = 25
[experiments.scenario]
schema = "transport-conformance.simulation/v1"
id = "finite-burst"
namespace = 101
slots = 160
channels = 4
source_blocks = 2
manifest_interval = 7
repair_floor = 1
generations = [{id=1,publish_slot=0,expires_slot=160,object_octets=4097}, {id=2,publish_slot=20,expires_slot=160,object_octets=1281}]
receivers = [{id="one",radios=1}, {id="four",radios=4}]

[[experiments]]
id = "fresh-priority-no-floor"
question = "Does sustained fresh priority starve an older generation for a receiver that joined after its original burst?"
[experiments.scenario]
schema = "transport-conformance.simulation/v1"
id = "fresh-priority-no-floor"
namespace = 102
slots = 96
channels = 4
manifest_interval = 5
repair_floor = 0
generations = [{id=1,publish_slot=0,expires_slot=160,object_octets=1281}, {id=2,publish_slot=8,expires_slot=160,object_octets=32768}, {id=3,publish_slot=16,expires_slot=160,object_octets=32768}, {id=4,publish_slot=24,expires_slot=160,object_octets=32768}, {id=5,publish_slot=32,expires_slot=160,object_octets=32768}]
receivers = [{id="late",radios=4,join_slot=8}]

[[experiments]]
id = "fresh-priority-repair-floor"
question = "What old-generation progress and fresh-capacity cost does one reserved repair lane produce?"
compare_to = "fresh-priority-no-floor"
[experiments.scenario]
schema = "transport-conformance.simulation/v1"
id = "fresh-priority-repair-floor"
namespace = 102
slots = 96
channels = 4
manifest_interval = 5
repair_floor = 1
generations = [{id=1,publish_slot=0,expires_slot=160,object_octets=1281}, {id=2,publish_slot=8,expires_slot=160,object_octets=32768}, {id=3,publish_slot=16,expires_slot=160,object_octets=32768}, {id=4,publish_slot=24,expires_slot=160,object_octets=32768}, {id=5,publish_slot=32,expires_slot=160,object_octets=32768}]
receivers = [{id="late",radios=4,join_slot=8}]

