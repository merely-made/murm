# V7 hardware receipt: Murm owner-policy admission over a real Reticulum link
# carried by two Tulle direct-PHY radios, set up through the session lane's
# security gate (Noise, then secure v2 admission). Standalone: it roots its own
# workspace and lock, like testing/iroh-control.
[package]
rust-version = "1.97.1"
name = "murm-direct-phy"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
identity = { package = "personae", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
murm = { path = "../../native/crates/murm", features = ["session-lane"] }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
retinue = { path = "../../crates/retinue", features = ["tulle-radio"] }
transport = { package = "mere-transport", path = "../../native/crates/transport", features = ["noise", "notochord", "reticulum"] }
tulle = { path = "../../crates/tulle", features = ["serial-async"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[workspace]

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

