# V7 hardware receipt: Murm owner-policy admission over a real Reticulum link
# carried by two Tulle direct-PHY radios, set up through the session lane's
# security gate (Noise, then secure v2 admission). Standalone because crates/probes is
# excluded from the Mere workspace and this receipt spans the live Retinue
# checkout.
[package]
rust-version = "1.97.1"
name = "murm-direct-phy"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
identity = { package = "personae", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
murm = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d", features = ["session-lane"] }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["tokio"] }
retinue = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d", features = ["tulle-radio"] }
transport = { package = "mere-transport", git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d", features = ["noise", "notochord", "reticulum"] }
tulle = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d", features = ["serial-async"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[workspace]

[patch.crates-io]
# The storage family uses the qualified Eidetic receiving cohort; the Git
# source forwarders below keep Murm's older pins on that same source.
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }

[patch."https://github.com/merely-made/eidetic.git"]
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "86e78dd37914fd61f8ca336bf0ab2da716356fca" }

# Compatibility source keys for immutable suppliers published before the
# repository rename. Targets and current direct dependencies use Murm.
[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d" }
murm = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d" }
retinue = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d" }
selvage = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d" }
tulle = { git = "https://www.github.com/merely-made/murm.git", rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[lints]
workspace = true

[patch."https://github.com/merely-made/distillery.git"]
esp = { git = "https://www.github.com/merely-made/distillery.git", rev = "25db074e2f9d33103535d5b0638bd6aa1daab0d9" }
esp-testkit = { git = "https://www.github.com/merely-made/distillery.git", rev = "25db074e2f9d33103535d5b0638bd6aa1daab0d9" }
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "25db074e2f9d33103535d5b0638bd6aa1daab0d9" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "25db074e2f9d33103535d5b0638bd6aa1daab0d9" }

[patch."https://github.com/merely-made/murm.git".mere-transport]
git = "https://www.github.com/merely-made/murm.git"
rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d"

[patch."https://github.com/merely-made/murm.git".murm]
git = "https://www.github.com/merely-made/murm.git"
rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d"

[patch."https://github.com/merely-made/murm.git".murm-sync]
git = "https://www.github.com/merely-made/murm.git"
rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d"

[patch."https://github.com/merely-made/murm.git".retinue]
git = "https://www.github.com/merely-made/murm.git"
rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d"

[patch."https://github.com/merely-made/murm.git".selvage]
git = "https://www.github.com/merely-made/murm.git"
rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d"

[patch."https://github.com/merely-made/murm.git".tulle]
git = "https://www.github.com/merely-made/murm.git"
rev = "98f79b4ef56168239eb93ceaae1dcdde465ee34d"
