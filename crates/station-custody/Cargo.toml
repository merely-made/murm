[package]
name = "station-custody"
version = "0.0.1"
edition = "2024"

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/murm"
publish = false
description = "Persona-backed custody adapter for Djinn-managed Retinue stations."

[dependencies]
dramatis.workspace = true
blake3.workspace = true
# The custody client: Signalman asks djinn for a station's keys, its grant
# and its revocation, and opens no wallet (dramatis repo plan, D5, D17). The
# first-party door's application side, without the Graphshell port (stack
# lift plan, L1).
ostiary = { workspace = true, features = ["native"] }
castellan-client = { workspace = true, features = ["client"] }
personae.workspace = true
# The check conclusions and faults, named directly (insigne proofs plan, B).
insigne = { workspace = true, features = ["verify"] }
p2panda-core = { package = "p2mere-core", version = "0.9" }
# Radio dependencies are in this repository; Signalman shares these exact
# path identities with the adapter.
outrider.workspace = true
postilion.workspace = true
radio-hand.workspace = true
retinue = { workspace = true, features = ["tulle-radio"] }
serde.workspace = true
serde_json.workspace = true
sporran.workspace = true
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
uuid.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# Private native adapter; kept outside the default radio workspace.
[workspace]
resolver = "2"

[workspace.dependencies]
dramatis = { version = "0.0.5", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
blake3 = "1"
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954", default-features = false }
castellan-client = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", default-features = false }
personae = { version = "0.3.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
outrider = { version = "=0.3.0", path = "../outrider" }
postilion = { version = "=0.3.0", path = "../postilion" }
radio-hand = { version = "=0.0.1", path = "../radio-hand" }
retinue = { version = "0.3.0", path = "../retinue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."crates-io"]
ostiary = { version = "0.0.1", git = "https://www.github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "4aaa64d169daa1990e8833e7abb931336f0d0a32" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "4aaa64d169daa1990e8833e7abb931336f0d0a32" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "4aaa64d169daa1990e8833e7abb931336f0d0a32" }

[patch."https://github.com/merely-made/armillary.git"]
ostiary = { version = "0.0.1", git = "https://www.github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }
