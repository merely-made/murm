[package]
name = "tulle"
version = "0.2.0"
edition = "2024"

rust-version = "1.97.1"
description = "Shared radio interface layer for LoRa mesh stacks: serial modem control, direct PHY, and medium access."
license-file = "LICENSE"
repository = "https://github.com/merely-made/murm"
readme = "README.md"
keywords = ["lora", "radio", "mesh", "rnode", "reticulum"]
categories = ["network-programming", "embedded"]

[features]
default = []
serial-async = ["dep:serial2-tokio", "dep:tokio"]
# An RNode reached over TCP (`RNodeInterface.py` 1452-1582): keepalive needs socket2.
rnode-tcp = ["serial-async", "dep:socket2"]

[dependencies]
serial2-tokio = { version = "0.1.24", optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
# `macros` is required by the library itself: the serial pumps use `tokio::select!`; `net`
# opens a pty, which serial2 cannot configure on macOS, through tokio's unix pipe. Without
# it `cargo test` still passes, because the dev-dependency below unifies the feature in, but a
# plain library build fails — so it has to be declared here.
tokio = { version = "1.53.1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
], optional = true }
selvage = { version = "0.1.0", path = "../selvage" }

[dev-dependencies]
embedded-io-async = "0.7.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[[example]]
name = "rnode_smoke"
required-features = ["serial-async"]

[[example]]
name = "rnode_roundtrip"
required-features = ["serial-async"]

[[example]]
name = "rnode_mtu"
required-features = ["serial-async"]

[[example]]
name = "rnode_bulk_probe"
required-features = ["serial-async"]

[[example]]
name = "le3_scan_probe"
required-features = ["serial-async"]

[[example]]
name = "rnode_witness_probe"
required-features = ["serial-async"]

[[example]]
name = "rnode_phy_cross"
required-features = ["serial-async"]

[[example]]
name = "direct_phy_sleep_proof"
required-features = ["serial-async"]

[[example]]
name = "rf_sniff"
required-features = ["serial-async"]
